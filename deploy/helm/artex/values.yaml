# ARTEX Helm chart values.
#
# AUTHORIZED USE ONLY. ARTEX acts against live targets. Only deploy and run it
# against systems you are explicitly authorized to test. The guardrails (scope gate,
# approval gate, budgets, noise governor, audit trail) run identically on every node.

nameOverride: ""
fullnameOverride: ""

image:
  # Published image (docker-compose.ghcr.yml). The 0.7.0 tag predates the GHCR publish
  # step; set image.tag to the first release that is published there.
  repository: ghcr.io/baarai/artex
  # Empty = "v" + Chart.appVersion. Prefer an explicit release tag or digest; there is
  # no floating "latest" default.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ---------------------------------------------------------------- secrets ---
# ARTEX_SECRET_KEY is the AES-256-GCM key (base64, 32 bytes) for secret columns in
# PostgreSQL. EVERY node (control and workers) must use the same one.
secretKey:
  # Name of an existing Secret holding the key. Empty = the chart generates one once
  # (kept across upgrades through `lookup`; NOT available under `helm template`/GitOps
  # renderers without cluster access, where you must supply existingSecret or value).
  existingSecret: ""
  existingSecretKey: secret-key
  # Inline base64 32-byte key (stored in the chart Secret). Prefer existingSecret.
  value: ""

# ----------------------------------------------------------------- LLM ------
llm:
  # Existing Secret whose keys are injected as env (e.g. ANTHROPIC_API_KEY, OPENAI_API_KEY).
  existingSecret: ""
  # Inline keys (stored in the chart Secret). Prefer existingSecret.
  anthropicApiKey: ""
  openaiApiKey: ""
  provider: ""
  model: ""
  baseUrl: ""
  proxy: ""
  # Exact host:port list the model-list fetch may reach on private addresses.
  privateEndpoints: ""

# ----------------------------------------------------------- shared settings ---
# Applied identically to control and worker nodes via one ConfigMap. Empty = unset
# (the binary's default). See .env.example in the repository for meaning.
settings:
  trustedProxies: ""        # ARTEX_TRUSTED_PROXIES (set to your ingress controller CIDR)
  untrustedBoundary: ""     # "0" disables the untrusted-output boundary (not recommended)
  updateCheck: ""           # ARTEX_UPDATE_CHECK
  noiseProfile: ""          # off | quiet | balanced | aggressive
  targetUserAgent: ""
  budgets:                  # unset or 0 = unlimited
    taskTokens: ""
    taskTurns: ""
    intentTokens: ""
    intentTurns: ""

# Agent egress filter (egress.sh): iptables rules for the executor uid. Requires NET_ADMIN.
egress:
  enabled: true             # adds NET_ADMIN capability to ARTEX containers
  filter: ""                # ARTEX_EGRESS_FILTER ("0" disables the filter)
  deny: ""                  # ARTEX_EGRESS_DENY extra CIDRs
  allow: ""                 # ARTEX_EGRESS_ALLOW CIDRs allowed despite default denies
  # Agent processes (the executor uid) must not reach ARTEX's own database or API. A
  # NetworkPolicy cannot express that: it applies to the whole pod, and the root server
  # process in the same pod needs PostgreSQL. So the deny is in the uid-scoped iptables
  # filter. true = ARTEX_EGRESS_DENY_HOSTS gets the PostgreSQL host (the bundled Service
  # is headless, so this is the database pod's own IP) and the control API Service,
  # resolved once at pod start. The control node's recording proxy stays reachable.
  denyClusterServices: true
  # Strict mode: the cluster's pod and Service CIDRs (for example ["10.244.0.0/16",
  # "10.96.0.0/12"]). Denied for agent processes on every ARTEX pod, which closes the
  # gaps the name-based deny leaves (a rescheduled database pod's new IP, the control
  # pod's own IP); the recording proxy Service is allowed by name. In-cluster lab
  # targets in these ranges then need egress.allow.
  clusterCIDRs: []
  denyHosts: ""             # extra ARTEX_EGRESS_DENY_HOSTS names (space/comma separated)
  allowHosts: ""            # extra ARTEX_EGRESS_ALLOW_HOSTS names

# Extra environment for all ARTEX pods (name: value). Use for settings not modelled above.
extraEnv: {}
extraEnvFrom: []

# Security context shared by control and worker containers.
# runAsNonRoot stays false: the binary runs as root so it can drop agent processes to an
# unprivileged executor uid (and egress.sh needs root + NET_ADMIN to install rules).
securityContext:
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: [ALL]
    # Capabilities added in addition to NET_ADMIN (when egress.enabled). The binary needs
    # CHOWN/SETUID/SETGID/DAC_OVERRIDE/FOWNER to prepare data and switch to the executor uid.
    add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]

# -------------------------------------------------------------- control ------
control:
  # Exactly one replica: the control node holds in-memory planner state.
  # Do not raise; the Deployment uses strategy Recreate.
  # Number of intent workers run inside the control process (ARTEX_LOCAL_WORKERS).
  # 0 sends every intent to worker nodes.
  localWorkers: 0
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 4Gi}
  persistence:
    data:
      enabled: true
      existingClaim: ""
      storageClass: ""
      accessModes: [ReadWriteOnce]
      size: 20Gi
    keys:                   # JWT signing key (jwt.key); losing it signs users out
      enabled: true
      existingClaim: ""
      storageClass: ""
      accessModes: [ReadWriteOnce]
      size: 100Mi
  service:
    type: ClusterIP
    port: 8787
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: artex.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: artex-tls
    #    hosts: [artex.example.com]
  # Capture proxy bind inside the control pod. Worker nodes reach it through the
  # ClusterIP Service <release>-control-proxy:8788. In the control role the proxy
  # refuses any non-loopback client that presents no worker scope token.
  proxyAddr: "0.0.0.0:8788"
  terminationGracePeriodSeconds: 60
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}

# -------------------------------------------------------------- workers ------
worker:
  enabled: true
  replicas: 2
  # Concurrent intents per worker node (ARTEX_NODE_WORKERS).
  concurrency: 3
  # Workers must land on separate hosts. "hard" = required anti-affinity on
  # kubernetes.io/hostname (pods stay Pending if there are fewer nodes than replicas);
  # "soft" = preferred; "none" = no anti-affinity (set your own under affinity).
  antiAffinity: hard
  topologyKey: kubernetes.io/hostname
  # maxSurge 0: with hard anti-affinity and as many hosts as replicas, a surge pod has no
  # host to land on and the rollout never progresses. Replace one worker at a time; its
  # claims are retaken after the 90s lease.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  # Health endpoint (plaintext, GET /healthz). Workers serve no API.
  healthPort: 8790
  # A worker finishes or abandons its claim; a lost claim is retaken after 90s.
  terminationGracePeriodSeconds: 120
  resources:
    requests: {cpu: "1", memory: 1Gi}
    limits: {memory: 4Gi}
  pdb:
    enabled: true
    maxUnavailable: 1
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}              # merged with the anti-affinity above (podAntiAffinity wins on conflict)
  extraEnv: {}
  # Scratch space for /app/data (emptyDir).
  ephemeralDataSizeLimit: 10Gi

# Optional NetworkPolicy for workers: no ingress except the health port; egress open
# (workers must reach targets, PostgreSQL and the LLM provider). Off by default because the
# kubelet source differs per CNI; set healthSourceCIDRs to the node CIDR(s) to restrict it.
networkPolicy:
  enabled: false
  healthSourceCIDRs: []     # empty = any source on the health port only

# ------------------------------------------------------------ PostgreSQL -----
postgresql:
  # Shared by control and workers. For production use an external managed PostgreSQL.
  sslmode: ""               # empty: "disable" for bundled, "require" for external
  external:
    host: ""
    port: 5432
    user: artex
    database: artex
    existingSecret: ""      # Secret holding the password
    existingSecretKey: password
    password: ""            # inline (stored in the chart Secret); prefer existingSecret
  # Simple single-instance StatefulSet for evaluation. No backups, no HA.
  bundled:
    enabled: true
    image:
      repository: postgres
      tag: 16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
      pullPolicy: IfNotPresent
    user: artex
    database: artex
    existingSecret: ""      # empty = chart generates a password once (via lookup)
    existingSecretKey: password
    persistence:
      storageClass: ""
      size: 20Gi
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {memory: 2Gi}
