{{- /* One Secret for chart-generated or inline values. Generated values are looked up so upgrades keep them. */ -}}
{{- $name := include "artex.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $old := dict -}}
{{- if $existing }}{{ $old = $existing.data }}{{ end -}}
{{- $needKey := not .Values.secretKey.existingSecret -}}
{{- $pgInline := or (and .Values.postgresql.bundled.enabled (not .Values.postgresql.bundled.existingSecret)) (and (not .Values.postgresql.bundled.enabled) (not .Values.postgresql.external.existingSecret)) -}}
{{- $llm := and (not .Values.llm.existingSecret) (or .Values.llm.anthropicApiKey .Values.llm.openaiApiKey) -}}
{{- if or $needKey $pgInline $llm }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "artex.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $needKey }}
  {{- if .Values.secretKey.value }}
  secret-key: {{ .Values.secretKey.value | b64enc }}
  {{- else if hasKey $old "secret-key" }}
  secret-key: {{ index $old "secret-key" }}
  {{- else }}
  secret-key: {{ randAlphaNum 32 | b64enc | b64enc }}
  {{- end }}
  {{- end }}
  {{- if $pgInline }}
  {{- if and (not .Values.postgresql.bundled.enabled) .Values.postgresql.external.password }}
  pg-password: {{ .Values.postgresql.external.password | b64enc }}
  {{- else if hasKey $old "pg-password" }}
  pg-password: {{ index $old "pg-password" }}
  {{- else if .Values.postgresql.bundled.enabled }}
  pg-password: {{ randAlphaNum 24 | b64enc }}
  {{- else }}
  {{- fail "set postgresql.external.existingSecret or postgresql.external.password" }}
  {{- end }}
  {{- end }}
  {{- if and $llm .Values.llm.anthropicApiKey }}
  anthropic-api-key: {{ .Values.llm.anthropicApiKey | b64enc }}
  {{- end }}
  {{- if and $llm .Values.llm.openaiApiKey }}
  openai-api-key: {{ .Values.llm.openaiApiKey | b64enc }}
  {{- end }}
{{- end }}
