apiVersion: v1
kind: Service
metadata:
  name: {{ include "artex.fullname" . }}-control
  labels:
    {{- include "artex.labels" . | nindent 4 }}
  {{- with .Values.control.service.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.control.service.type }}
  ports:
    - name: http
      port: {{ .Values.control.service.port }}
      targetPort: http
  selector:
    {{- include "artex.selector" (dict "ctx" . "component" "control") | nindent 4 }}
