version: 2
updates:
  # Keep the digest-pinned base images current. Dependabot preserves the tag
  # (e.g. node:22-bookworm-slim) and bumps the @sha256 digest when the tag moves.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(docker)"

  # Workflow actions are pinned to full commit SHAs (with a "# vX.Y.Z" comment);
  # Dependabot bumps the SHA and the comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(go)"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(web)"

  # The Playwright toolchain baked into the image (docker/playwright/package-lock.json).
  - package-ecosystem: "npm"
    directory: "/docker/playwright"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(playwright)"
