# Control node + two worker nodes on one Docker host (E7, docs/DISTRIBUTED.md).
# Each worker is its own container (its own host name, network namespace,
# executor isolation and egress filter); only Postgres is shared.
#
#   docker compose -f docker-compose.yml -f docker-compose.distributed.yml up -d --build
#
# ARTEX_SECRET_KEY must be set in .env (base64 of 32 bytes): every node must
# decrypt the same secret columns. For real separate hosts use the Helm chart
# (deploy/helm/artex) or run the worker command below on each host.
#
# The control API is HTTPS (docs/DISTRIBUTED.md "Transport"): artex-tls-init
# makes a private CA and the control certificate once (`artex node-tls`), the
# control node serves it, and workers trust only that CA (ARTEX_CONTROL_CA).
# The UI is then https://localhost:8787; the browser warns until you trust
# ca.crt (docker compose cp worker-1:/app/control-ca/ca.crt .).
# The workers' recording-proxy hop is TLS too: the control node serves the
# proxy's TLS front on :8789 with the same certificate, and each worker's agents
# use a loopback relay that dials it pinned to the CA, so plain-HTTP target
# traffic and the scope tokens never cross the Docker network in clear text.
services:
  artex-tls-init:
    image: artex:local
    # Writes the key and certificate to artex-tls (control only) and the CA
    # certificate to artex-control-ca (workers). Keeps existing files.
    entrypoint: ["/app/artex", "node-tls", "-dir", "/tls", "-ca-dir", "/ca", "-names", "artex,localhost", "-ips", "127.0.0.1"]
    volumes:
      - artex-tls:/tls
      - artex-control-ca:/ca
    restart: "no"

  artex:
    # Workers use the proxy's TLS front (:8789). The plain proxy still binds
    # beyond loopback so the base file's host port 127.0.0.1:8788 reaches it; in
    # the control role it refuses any remote client that presents no scope token.
    command: ["-role", "control", "-addr", ":8787", "-proxy", "0.0.0.0:8788", "-proxy-tls", ":8789"]
    depends_on:
      artex-tls-init:
        condition: service_completed_successfully
    volumes:
      - artex-tls:/app/tls:ro
    environment:
      ARTEX_TLS_CERT: /app/tls/tls.crt
      ARTEX_TLS_KEY: /app/tls/tls.key
      ARTEX_PROXY_ALLOW_NONLOOPBACK: "1"
      ARTEX_ROLE: control
      ARTEX_NODE_ID: control
      ARTEX_LOCAL_WORKERS: "0"
      ARTEX_SECRET_KEY: ${ARTEX_SECRET_KEY:?set ARTEX_SECRET_KEY in .env so every node shares it}

  worker-1: &worker
    image: artex:local
    command: ["-role", "worker", "-proxy", "", "-health-addr", ":8790"]
    security_opt:
      - "no-new-privileges:true"
    cap_add:
      - NET_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
      artex:
        condition: service_started
    environment: &worker-env
      ARTEX_ROLE: worker
      ARTEX_NODE_ID: worker-1
      ARTEX_NODE_WORKERS: "3"
      # The proxy's TLS front, pinned to ARTEX_CONTROL_CA (docs/DISTRIBUTED.md
      # "Transport"): the agents get a loopback relay as their proxy.
      ARTEX_CONTROL_PROXY: https://artex:8789
      ARTEX_CONTROL_API: https://artex:8787
      ARTEX_CONTROL_CA: /app/control-ca/ca.crt
      ARTEX_PG_HOST: postgres
      ARTEX_PG_PORT: "5432"
      ARTEX_PG_USER: ${POSTGRES_USER:-artex}
      ARTEX_PG_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      ARTEX_PG_DBNAME: ${POSTGRES_DB:-artex}
      ARTEX_PG_SSLMODE: disable
      ARTEX_SECRET_KEY: ${ARTEX_SECRET_KEY:?set ARTEX_SECRET_KEY in .env so every node shares it}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_EGRESS_DENY: ${ARTEX_EGRESS_DENY:-}
      ARTEX_EGRESS_ALLOW: ${ARTEX_EGRESS_ALLOW:-}
      ARTEX_UNTRUSTED_BOUNDARY: ${ARTEX_UNTRUSTED_BOUNDARY:-}
      ARTEX_TARGET_USER_AGENT: ${ARTEX_TARGET_USER_AGENT:-}
    # Only the CA certificate: worker containers never see the control key.
    volumes:
      - artex-control-ca:/app/control-ca:ro
    restart: unless-stopped

  worker-2:
    <<: *worker
    environment:
      <<: *worker-env
      ARTEX_NODE_ID: worker-2

volumes:
  artex-tls:
  artex-control-ca:
