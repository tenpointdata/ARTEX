# Control node + two worker nodes on one Docker host (E7, docs/DISTRIBUTED.md).
# Each worker is its own container (its own host name, network namespace,
# executor isolation and egress filter); only Postgres is shared.
#
#   docker compose -f docker-compose.yml -f docker-compose.distributed.yml up -d --build
#
# ARTEX_SECRET_KEY must be set in .env (base64 of 32 bytes): every node must
# decrypt the same secret columns. For real separate hosts use the Helm chart
# (deploy/helm/artex) or run the worker command below on each host.
services:
  artex:
    # The proxy listens beyond loopback for the workers; in the control role it
    # refuses any non-loopback client that presents no worker scope token.
    command: ["-role", "control", "-addr", ":8787", "-proxy", "0.0.0.0:8788"]
    environment:
      ARTEX_PROXY_ALLOW_NONLOOPBACK: "1"
      ARTEX_ROLE: control
      ARTEX_NODE_ID: control
      ARTEX_LOCAL_WORKERS: "0"
      ARTEX_SECRET_KEY: ${ARTEX_SECRET_KEY:?set ARTEX_SECRET_KEY in .env so every node shares it}

  worker-1: &worker
    image: artex:local
    command: ["-role", "worker", "-proxy", "", "-health-addr", ":8790"]
    security_opt:
      - "no-new-privileges:true"
    cap_add:
      - NET_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
      artex:
        condition: service_started
    environment: &worker-env
      ARTEX_ROLE: worker
      ARTEX_NODE_ID: worker-1
      ARTEX_NODE_WORKERS: "3"
      ARTEX_CONTROL_PROXY: http://artex:8788
      ARTEX_PG_HOST: postgres
      ARTEX_PG_PORT: "5432"
      ARTEX_PG_USER: ${POSTGRES_USER:-artex}
      ARTEX_PG_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      ARTEX_PG_DBNAME: ${POSTGRES_DB:-artex}
      ARTEX_PG_SSLMODE: disable
      ARTEX_SECRET_KEY: ${ARTEX_SECRET_KEY:?set ARTEX_SECRET_KEY in .env so every node shares it}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_EGRESS_DENY: ${ARTEX_EGRESS_DENY:-}
      ARTEX_EGRESS_ALLOW: ${ARTEX_EGRESS_ALLOW:-}
      ARTEX_UNTRUSTED_BOUNDARY: ${ARTEX_UNTRUSTED_BOUNDARY:-}
      ARTEX_TARGET_USER_AGENT: ${ARTEX_TARGET_USER_AGENT:-}
    volumes: []
    restart: unless-stopped

  worker-2:
    <<: *worker
    environment:
      <<: *worker-env
      ARTEX_NODE_ID: worker-2
